<!doctype html><html data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--tg-screen);color:var(--tg-ink);font-family:var(--tg-font-text)}.row{display:flex;gap:10px;flex-wrap:wrap}.sw{width:88px;display:flex;flex-direction:column;gap:6px}.chip{height:48px;border-radius:12px;border:1px solid var(--tg-line)}.n{font-size:14px;font-weight:600}.h{font:14px ui-monospace,Menlo,monospace;color:var(--tg-ink-2)}.i{font-family:var(--tg-font-icon);font-size:24px;line-height:1;font-variation-settings:'FILL' 0,'wght' 500}</style></head><body><div class="row"><div style="flex:1;min-width:150px;background:var(--tg-sunken);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center"><span class="i" style="color:var(--tg-ink-2);font-variation-settings:'FILL' 1,'wght' 600">info</span><span style="font-size:15px;font-weight:600">нейтрально</span></div><div style="flex:1;min-width:150px;background:var(--tg-done-tint);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center"><span class="i" style="color:var(--tg-done);font-variation-settings:'FILL' 1,'wght' 600">check</span><span style="font-size:15px;font-weight:600">Доза дана в 06:50</span></div><div style="flex:1;min-width:150px;background:var(--tg-waiting-bg);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center"><span class="i" style="color:var(--tg-waiting);font-variation-settings:'FILL' 1,'wght' 600">hourglass_top</span><span style="font-size:15px;font-weight:600">Не кормить до 07:30</span></div><div style="flex:1;min-width:150px;background:var(--tg-alarm-bg);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center"><span class="i" style="color:var(--tg-alarm);font-variation-settings:'FILL' 1,'wght' 600">priority_high</span><span style="font-size:15px;font-weight:600">Доза пропущена</span></div></div></body></html>
