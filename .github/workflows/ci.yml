name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Сборка и тесты
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Выбрать Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      # Проект и токены генерируются скриптами: если сгенерированное
      # разошлось с источником — это ошибка сборки, а не сюрприз в ревью.
      - name: Проверить токены
        run: make tokens-check

      - name: Перегенерировать проект
        run: make project

      - name: Проверить, что проект не разошёлся
        run: git diff --quiet -- Togo.xcodeproj || (echo "Запусти make project и закоммить" && exit 1)

      - name: Тесты
        run: |
          xcodebuild -project Togo.xcodeproj -scheme Togo -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -resultBundlePath build/Togo.xcresult \
            test

      - name: Сохранить результаты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/Togo.xcresult
          retention-days: 7
