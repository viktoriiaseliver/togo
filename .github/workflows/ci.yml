name: CI

# ПУША ЗДЕСЬ НЕТ, И ЭТО РЕШЕНИЕ ВИКТОРИИ 27.10.2026, А НЕ ЭКОНОМИЯ
# ПО ВКУСУ. Замер того же дня, страница Actions:
#
#   219 прогонов · последние шесть красные · время 4–37 секунд
#   «The job was not started because recent account payments have
#    failed or your spending limit needs to be increased»
#
# То есть CI не падал — ОН НЕ ЗАПУСКАЛСЯ. Ни сборки, ни тестов в этих
# прогонах не было вовсе, а выглядело это как «сборка и тесты падают».
# Четыре секунды против шести минут — единственный признак, по которому
# одно отличалось от другого, и он не бросается в глаза.
#
# Почему лимит кончился. Минуты macOS списываются ×10, репозиторий
# приватный — значит платные с первой минуты. Фильтр по путям здесь
# стоял и был верным, но в него входили `Tools/**` и `**.swift`,
# а за одну смену 27.10 в них ушло больше двадцати коммитов: правки
# инструментов, каталога строк, схемы. Фильтр отсекает документы,
# и не отсекает работу.
#
# ЧЕМ ЗАПЛАЧЕНО ЗА ОТКАЗ ОТ ПУША. При работе прямо в `main` — а здесь
# работают так — автоматического сигнала на коммит больше нет.
# Остаются три входа, и каждый назван нарочно:
#
#   pull_request      проверка перед слиянием, с тем же фильтром путей
#   schedule          раз в неделю: ловит то, что ушло в main мимо PR
#   workflow_dispatch кнопка «Run workflow» — когда ответ нужен сейчас
#
# Еженедельный прогон здесь не украшение: он ЕДИНСТВЕННЫЙ, кто краснеет
# сам по себе при прямых коммитах. Снять его — значит оставить CI
# без автоматического голоса вовсе.
#
# И отдельно: локальный прогон на машине Виктории этим не задет.
# `make unit` и worktree работают как раньше — платные только
# раннеры GitHub.
on:
  pull_request:
    # Тот же фильтр, что стоял на пуше: PR, меняющий только журнал
    # или СТАТУС, незачем гонять на платном раннере.
    paths:
      - '**.swift'
      - '**.xcstrings'
      - '**.xcodeproj/**'
      - '**.entitlements'
      - '**/Info.plist'
      - 'DesignTokens/**'
      - 'Tools/**'
      - 'Makefile'
      - '.github/workflows/ci.yml'
  # UI-набор идёт ~15 минут на macOS, то есть ~150 минут лимита за прогон.
  # Здесь гоняются только модульные тесты.
  schedule:
    - cron: '0 3 * * 0'   # воскресенье, 05:00 по Ницце летом
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Сборка и тесты
    runs-on: macos-15
    # Зависший прогон на macOS съедает лимит за час; штатный укладывается быстрее.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Путь выбирается, а не пишется константой. Раньше здесь стояло
      # /Applications/Xcode_26.app — такого пути на образе macos-15 нет
      # вовсе: есть Xcode_26.3.app, Xcode_26.2.app, Xcode_26.1.1.app,
      # Xcode_26.0.1.app. Шаг падал за шесть секунд, и падал на каждом
      # пуше с тех пор, как образ обновился. Красный CI, на который никто
      # не смотрит, — это тот же дефект, против которого заведён журнал:
      # работа есть, сигнала нет.
      #
      # Пин на 26.3 сломался бы точно так же со следующим образом,
      # поэтому берём самый новый Xcode, какой есть, и печатаем выбор.
      # Не нашлось ни одного — падаем со списком, а не с «No such file
      # or directory».
      #
      # Глоб был `Xcode_26*.app` — тот же пин, только шире на порядок:
      # он НИКОГДА не совпал бы с Xcode 27, а разработка уехала на 27.0
      # 21.09. CI сидел бы на 26.x и зелёным цветом обещал то, чего
      # локально уже нет. Версия из имени не задаётся вовсе.
      - name: Выбрать Xcode
        run: |
          set -euo pipefail
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "::error::Xcode на раннере нет. Что установлено:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "Выбран $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      # Проект и токены генерируются скриптами: если сгенерированное
      # разошлось с источником — это ошибка сборки, а не сюрприз в ревью.
      - name: Проверить токены
        run: make tokens-check

      - name: Перегенерировать проект
        run: make project

      - name: Проверить, что проект не разошёлся
        run: git diff --quiet -- Togo.xcodeproj || (echo "Запусти make project и закоммить" && exit 1)

      # Устройство ищется, а не называется. Имя в назначении — вторая
      # ловушка того же рода, что путь к Xcode: прогоны #44 и #45
      # выбрали ОДИН И ТОТ ЖЕ Xcode 26.3 (17C529), но на машине #45
      # симулятора «iPhone 17 Pro» не оказалось вовсе — в списке
      # остались только заглушки «Any iOS Simulator Device». Красный
      # при этом выглядел как «сломал тот, кто последним пушил».
      # Скрипт берёт готовый симулятор, а если готовых нет — заводит;
      # не вышло и это — падает со списком всего, что видно.
      # `echo "udid=$(...)"` возвращал код самого echo, то есть ноль:
      # скрипт падал, шаг оставался зелёным, в выход уезжало пустое
      # `udid=`, и рвался СЛЕДУЮЩИЙ шаг на `-destination '…,id='`.
      # Претензия оказывалась не там, где причина, а диагностический
      # список, который скрипт печатает при сдаче, никто не читал.
      # Ровно тот дефект, против которого этот шаг и написан.
      - name: Найти симулятор
        id: sim
        run: |
          set -euo pipefail
          udid="$(python3 Tools/ci_simulator.py)"
          test -n "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Код возврата здесь НЕ решает, и это не поблажка.
      #
      # С 07.10.2026 в наборе есть тесты, красные НАРОЧНО: пять
      # примитивов отступа вне шкалы (дизайн заморожен), шесть ключей
      # без переводов (текст заморожен) и сторож обещания переноса,
      # который держит находку числом до разморозки. Такой прогон
      # всегда даёт 65, и по коду возврата отличить его от регрессии
      # нельзя вовсе.
      #
      # Уводить намеренно красных в отдельный прогон — решение Виктории
      # ПРОТИВ: сторож, рождённый красным, работает на пуше, а уведённый
      # в сторону перестаёт сторожить там, где нужен.
      #
      # Поэтому решение принимает следующий шаг — по ИМЕНАМ упавших,
      # а не по их числу. Печать кода и возврат кода — разные действия,
      # и здесь возврат отдан тому, кто умеет читать лог.
      - name: Модульные тесты
        run: |
          mkdir -p build
          # Без конвейера нарочно: `$?` после `| tee` — это код `tee`,
          # а не `xcodebuild`. Ровно эта ловушка у нас записана дважды,
          # и второй раз от неё не спас даже `pipefail` — там хвостом
          # стоял `echo`.
          # `OTHER_SWIFT_FLAGS` — настройкой сборки, а не аргументом
          # `xcodebuild`: прямым аргументом `-Xfrontend` даёт
          # `invalid option`, и на этом уже потерян один прогон 07.10.
          # `$(inherited)` обязателен, иначе затирается то, что проект
          # мог бы подставить сам.
          #
          # Порог 500 — это порог ВИДИМОСТИ, не ворота. Ворота ниже,
          # отдельным шагом, и у них порог свой. Низкий порог здесь
          # нужен не ради строгости: он даёт шагу-воротам способ
          # отличить «долгих нет» от «флаг не доехал».
          rc=0
          xcodebuild -project Togo.xcodeproj -scheme Togo -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -resultBundlePath build/Togo.xcresult \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -warn-long-function-bodies=500 -Xfrontend -warn-long-expression-type-checking=500' \
            test -only-testing:TogoTests > build/unit.log 2>&1 || rc=$?
          tail -60 build/unit.log
          echo "xcodebuild: код возврата $rc"
          # Возврат отдан следующему шагу СОЗНАТЕЛЬНО, и это единственное
          # место в проекте, где код проглочен намеренно. Проглотить его
          # безопасно только потому, что сверка красит сборку и при
          # «сверять нечем»: ошибка компиляции даст код 2, а не успех.
          exit 0

      # Ворота. Красит сборку, если появилось имя не из эталона ИЛИ
      # ожидаемо красный позеленел: во втором случае причина умерла,
      # а запись осталась — и дальше она молча разрешает настоящую
      # регрессию под тем же именем.
      #
      # Код 2 — «сверять нечем»: прогон не состоялся (мёртвый сервер
      # симулятора, ноль выполненных, перезапуски). Это не «сошлось»
      # и не «не сошлось», а отказ инструмента наблюдения, и он тоже
      # красит сборку — иначе стенд читался бы как успех.
      - name: Сверить с эталоном прогона
        if: always()
        run: python3 Tools/сверить_эталон.py --лог build/unit.log

      # Сторож времени типизации. Делает видимым до чужой машины то,
      # что иначе видно только падением на ней.
      #
      # Зачем именно в CI. Срыв типизатора — единственный известный нам
      # дефект, у которого присутствие в коде НЕ означает присутствия
      # в сборке: разница между машинами здесь загрузка, а не код.
      # 07.10 прогон упал на раннере на выражении, которое локально
      # собиралось, и шесть прогонов подряд искали причину не там.
      # Общий свод называет этот сторож лечением класса — и до 08.10
      # его не было ВОВСЕ (измерено grep по этому файлу).
      #
      # ПОРОГ ВЗЯТ У ДЕФЕКТА, А НЕ У НЫНЕШНЕГО ХУДШЕГО. Замер 08.10
      # на `4c4debd`, цель приложения, свой worktree, своя DerivedData:
      #
      #   DuplicateDogCard.связанных   3376 мс   ← на этом падал CI
      #   DuplicateMerge.записейУ      3199 мс
      #   после починки                ниже 100 мс, оба
      #   худшее в проекте теперь      655 мс  (ShiftReport.swift:14)
      #
      # И ПОЧЕМУ ВОРОТА НЕ НА 1000, хотя 1000 просил наряд. Тот же
      # `ShiftReport.build` на том же коммите при сборке ВМЕСТЕ
      # с тестовыми целями дал **1056 мс** — то есть перешагнул 1000,
      # не изменившись ни строкой. Разница между 655 и 1056 здесь
      # загрузка, и ровно это свойство у дефекта главное. Ворота
      # на 1000 покраснели бы в первый же день на верном коде.
      #
      # Ворота на 2000: оба случая дефекта поймались бы с запасом,
      # а 1056 не кричит. Поднимать порог под шум нельзя — шум
      # не остаётся шумом, он оседает числом в пороге и делает дыру
      # ровно того размера, которым шумели; здесь порог взят у дефекта
      # заранее, а не поднят после крика. Всё от 500 до 2000
      # ПЕЧАТАЕТСЯ и НЕ красит: видимость и ворота — разные вещи.
      #
      # Долг тестовых целей измерен отдельно и равен нулю: при пороге
      # 1000 в `TogoTests`/`TogoUITests` не нашлось ни одного
      # выражения. Сторож рождён зелёным, и это «нечего было
      # находить», а не «не нашёл».
      #
      # И главное: ноль найденного здесь НЕ значит «долгих нет».
      # Он может значить «флаг не доехал», а эти два ответа снаружи
      # неразличимы — у нас это целый раздел свода. Различитель
      # измерен: `xcodebuild` печатает команды компиляции вместе
      # с флагом, 8 вхождений на прогон. Нет ни одного — это отказ
      # инструмента, и он красит сборку, а не молчит.
      - name: Сторож времени типизации
        if: always()
        run: |
          # Имена переменных ТОЛЬКО латиницей, и это не стиль.
          # `ЛОГ=build/unit.log` в bash не заводится вовсе — оболочка
          # читает это как команду и отвечает `No such file or
          # directory`, а следующая строка выполняется как ни в чём
          # не бывало. Первая редакция этого шага была написана
          # кириллицей, и проверено на месте:
          #
          #   bash -c 'ЛОГ=x; echo "$ЛОГ"'
          #   → ЛОГ=x: command not found
          #   → $'\xd0': unbound variable
          #
          # То есть сторож, который ищет молчаливую ложь, сам стал бы
          # ею: инструмент проверки подвержен ровно тому классу,
          # который ищет. Спас `set -u` — без него вышла бы пустая
          # строка и зелёный шаг.
          set -uo pipefail
          LOG=build/unit.log
          test -f "$LOG" || { echo "::error::нет $LOG — сторожу нечего читать"; exit 2; }

          arrived=$(grep -c -- '-warn-long-function-bodies=' "$LOG" || true)
          if [ "$arrived" -eq 0 ]; then
            echo "::error::ФЛАГ НЕ ДОЕХАЛ: в логе ни одной команды компиляции"
            echo "с -warn-long-function-bodies. Это НЕ «долгих выражений нет» —"
            echo "это отказ инструмента наблюдения, и отличить одно от другого"
            echo "по пустому результату нельзя. Проверь OTHER_SWIFT_FLAGS"
            echo "в шаге «Модульные тесты»."
            exit 2
          fi

          grep -oE '[^ ]+\.swift:[0-9]+:[0-9]+: warning: .*took [0-9]+ms to type-check' "$LOG" \
            | sort -u > build/typecheck.txt || true

          echo "Флаг доехал: $arrived команд компиляции несут порог."
          echo "Выражений дороже 500 мс: $(wc -l < build/typecheck.txt)"
          cat build/typecheck.txt || true

          # Код возврата берётся у самого замера. Напечатать число
          # и вернуть отказ — разные действия: печать видит человек,
          # читающий лог, код видит тот, кто решает, зелено ли.
          costly=$(grep -oE 'took [0-9]+ms' build/typecheck.txt \
            | grep -oE '[0-9]+' | awk '$1 >= 2000' | wc -l | tr -d ' ')
          if [ "$costly" -gt 0 ]; then
            echo "::error::$costly выражений дороже 2000 мс типизации."
            echo "Это возврат перебора, на котором CI уже падал 07.10."
            echo "Лечится не упрощением на глаз: смотри, нет ли в том же файле"
            echo "настоящей ошибки типа — тогда сперва она, а «упрости"
            echo "выражение» чинит не то."
            exit 1
          fi

      # Ворота на пуш — модульные тесты. UI-набор мигает
      # (FoodStockUITests, недостижимость «Сухой»: a2be5a8 упал, 73bae79
      # прошёл, 20d84ea упал — экран не менялся) и красил каждый коммит,
      # не говоря о нём ничего. Пока не починен, он не ворота: идёт по
      # расписанию и по кнопке, результат — в артефакте.
      - name: UI-тесты
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          xcodebuild -project Togo.xcodeproj -scheme Togo -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}' \
            -resultBundlePath build/TogoUI.xcresult \
            test -only-testing:TogoUITests

      - name: Сохранить результаты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: |
            build/Togo.xcresult
            build/TogoUI.xcresult
            build/unit.log
          retention-days: 7
          # Упав до тестов, шаг оставлял вторую претензию поверх первой —
          # «no files found» — и в письме их становилось три вместо одной.
          # Причину искать надо в первой.
          if-no-files-found: ignore
