<!-- @dsCard group="Components" viewport="760x1100" name="Togo · Финал" subtitle="Показание T5+, лента, запас по уровням, свайп" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../preview-loader.js"></script>
</head><body style="margin:0;background:#0A0A0A;padding:20px;box-sizing:border-box;font-family:var(--font-text)">
<div id="root"></div>
<script type="text/babel">
loadGraphite().then((G) => {
  const { ReadingCard, FeedRow, StockCard, SwipeRow, StatusLine, Toast } = G;
  const L = ({ children }) => <span style={{ fontSize: 13, color: "var(--text-secondary)" }}>{children}</span>;
  const Col = ({ children, theme = "dark" }) => <div data-theme={theme} style={{ display: "flex", flexDirection: "column", gap: 12, padding: 16, borderRadius: 24, background: "var(--bg-primary)", color: "var(--text-primary)" }}>{children}</div>;
  const walk = { icon: "directions_walk", title: "Выход около 11:00", short: "11:00", when: "через 1 ч 20" };
  function App() {
    return (<div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(340px,1fr))", gap: 16, alignItems: "start" }}>
      <Col><L>ReadingCard · collapse 0</L><ReadingCard label="С прогулки" parts={[{ v: "2", u: "ч" }, { v: "10", u: "мин" }]} bar={{ pct: 62, from: "гулял в 7:28", to: "обычно до 11:00" }} next={walk} /></Col>
      <Col theme="light"><L>ReadingCard · collapse 1 · натощак · Light</L><StatusLine tone="warning" icon="no_meals" text="Не кормить ещё 19 мин" /><ReadingCard label="С прогулки" parts={[{ v: "1", u: "ч" }, { v: "01", u: "мин" }]} bar={{ pct: 37, from: "доза в 8:00", to: "еда в 8:30", tone: "warning" }} next={{ icon: "restaurant", title: "Завтрак 65 г", short: "8:30", when: "в 8:30" }} collapse={1} /></Col>
      <Col><L>ReadingCard · alarm</L><ReadingCard tone="alarm" label="С прогулки" parts={[{ v: "0", u: "ч" }, { v: "24", u: "мин" }]} next={{ icon: "local_hospital", title: "Вет+ · открыт до 20:00", short: "Вет+", when: "+33 4 93…", tone: "error" }} /></Col>
      <Col><L>FeedRow · walk / default / incident / warning</L><div>
        <FeedRow icon="restaurant" title="Еда" value="65" detail="г · съел" who="мама" time="8:31" />
        <FeedRow icon="sick" kind="incident" title="Вырвал" detail="травой" who="ты" time="8:10" />
        <FeedRow icon="bolt" kind="warning" title="Срыв" detail="детали — в итоге" time="7:55" />
        <FeedRow icon="directions_walk" kind="walk" title="Улица" value="18" detail="мин · пописал" who="ты" time="7:10" last /></div></Col>
      <Col><L>StockCard · out / low / ok</L>
        <StockCard name="Левотироксин" perDay="1,5 таб. в день" left="4" unit="таб" until="сб 6 окт" daysLeft={2} status="Кончится в субботу" onBought={() => {}} />
        <StockCard icon="restaurant" name="Корм" perDay="130 г в день" left="0,8" unit="кг" until="ср 10 окт" daysLeft={6} status="Осталось на 6 дней" onBought={() => {}} />
        <StockCard icon="water_drop" name="Капли Вет" perDay="0,5 мл в день" left="6,5" unit="мл" until="чт 11 окт" daysLeft={13} status="Курс кончится раньше — не покупать" /></Col>
      <Col theme="light"><L>SwipeRow + Toast undo · Light</L><SwipeRow offset={-176}><FeedRow icon="directions_walk" kind="walk" title="Улица" value="18" detail="мин · пописал" who="ты" time="7:10" last /></SwipeRow><Toast tone="undo" text="Удалено · улица 7:10" actionLabel="Отменить" onAction={() => {}} /></Col>
    </div>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script></body></html>
