<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../graphite.css"></head>
<body style="background:var(--bg-primary);padding: 20px;box-sizing:border-box;min-height:100vh"><div style="display:flex;flex-direction:column;gap:12px"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--accent);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">accent</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--accent-pressed);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">accent-pressed</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--accent-text);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">accent-text</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--on-accent);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">on-accent</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--accent-subtle);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">accent-subtle</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--accent-subtle-text);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">accent-subtle-text</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--accent-knob);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">accent-knob</span></div></div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span style="min-height:44px;padding:0 20px;border-radius:999px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;font-size:15px">Сохранить</span><span style="min-height:28px;padding:0 12px;border-radius:999px;background:var(--accent-subtle);color:var(--accent-subtle-text);display:flex;align-items:center;font-size:13px">В сети</span><span style="font-size:17px;color:var(--accent-text)">Изменить</span><div style="width:64px;height:36px;border-radius:999px;background:var(--accent);display:flex;justify-content:flex-end;padding:4px;box-sizing:border-box"><div style="width:30px;height:30px;border-radius:50%;background:var(--accent-knob)"></div></div></div></div></body></html>
