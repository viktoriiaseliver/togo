<!-- @dsCard group="Brand" viewport="700x200" name="Собачьи мотивы" subtitle="Косточка · следы · жетон · лапа-действие" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body data-theme="dark" style="margin:0;background:var(--bg-primary);color:var(--text-primary);padding:20px;box-sizing:border-box;font-family:var(--font-text)">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:end">
  <div style="display:flex;flex-direction:column;gap:12px"><div style="height:80px;display:flex;align-items:center"><div style="position:relative;flex:1;height:8px;margin:5px 7px"><span style="position:absolute;inset:0;border-radius:999px;background:var(--fill-3)"></span><span style="position:absolute;left:-7px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--accent)"></span><span style="position:absolute;left:-7px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--accent)"></span><span style="position:absolute;right:-7px;top:-5px;width:10px;height:10px;border-radius:50%;background:var(--fill-3)"></span><span style="position:absolute;right:-7px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--fill-3)"></span><span style="position:absolute;left:0;top:0;bottom:0;width:62%;border-radius:999px;background:var(--accent)"></span></div></div><span style="font-size:13px;color:var(--text-secondary)">косточка · полоса до следующего</span></div>
  <div style="display:flex;flex-direction:column;gap:12px"><div style="height:80px;display:flex;gap:10px;align-items:center;font-family:var(--font-icon);font-size:22px"><span style="transform:rotate(90deg) translateX(-6px);color:var(--fill-3)">pets</span><span style="transform:rotate(90deg) translateX(6px);color:var(--fill-3)">pets</span><span style="transform:rotate(90deg) translateX(-6px);color:var(--text-disabled)">pets</span><span style="transform:rotate(90deg) translateX(6px);color:var(--accent-text)">pets</span></div><span style="font-size:13px;color:var(--text-secondary)">следы · ведут к действию</span></div>
  <div style="display:flex;flex-direction:column;gap:12px"><div style="height:80px;display:flex;align-items:center"><span style="position:relative;width:56px;height:68px;display:flex;align-items:flex-end;justify-content:center"><span style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 3px var(--fill-3)"></span><span style="width:56px;height:58px;border-radius:28px 28px 22px 22px;background:var(--fill-2);box-shadow:inset 0 0 0 3px var(--fill-3);display:flex;align-items:center;justify-content:center;font-family:var(--font-icon);font-size:26px;color:var(--text-secondary)">pets</span></span></div><span style="font-size:13px;color:var(--text-secondary)">жетон · аватар собаки, бирка</span></div>
  <div style="display:flex;flex-direction:column;gap:12px"><div style="height:80px;display:flex;align-items:center"><span style="width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--on-accent);box-shadow:0 var(--edge-height) 0 var(--accent-edge),0 0 0 6px var(--glass-tint-accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-icon);font-size:30px">pets</span></div><span style="font-size:13px;color:var(--text-secondary)">лапа · действия собаки</span></div>
</div></body></html>
