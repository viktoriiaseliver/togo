<!-- @dsCard group="Colors" viewport="700x190" name="Статусы" subtitle="Ошибка и предупреждение — только в статусах" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../graphite.css"></head>
<body style="background:var(--bg-primary);padding: 20px;box-sizing:border-box;min-height:100vh"><div style="display:flex;flex-direction:column;gap:12px"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--status-error);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">status-error</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--error-subtle);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">error-subtle</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--status-warning);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">status-warning</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--warning-subtle);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">warning-subtle</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--toggle-off);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">toggle-off</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--toggle-off-knob);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">toggle-off-knob</span></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><span style="min-height:28px;padding:0 12px;border-radius:999px;background:var(--warning-subtle);color:var(--status-warning);display:flex;align-items:center;font-size:13px">Обновляется</span><span style="min-height:28px;padding:0 12px;border-radius:999px;background:var(--error-subtle);color:var(--status-error);display:flex;align-items:center;font-size:13px">Нет связи</span></div></div></body></html>
