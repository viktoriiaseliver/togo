<!-- @dsCard group="Colors" viewport="700x170" name="Запас и тревога" subtitle="Лайм > 7 дн · оранжевый ≤ 7 · красный ≤ 3" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;background:#0A0A0A;padding:16px;box-sizing:border-box;font-family:var(--font-text)">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
  <div data-theme="dark" style="display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;background:var(--bg-primary);color:var(--text-primary)">
    <div style="display:flex;gap:8px"><span style="flex:1;height:36px;border-radius:12px;background:var(--accent)"></span><span style="flex:1;height:36px;border-radius:12px;background:var(--stock-low)"></span><span style="flex:1;height:36px;border-radius:12px;background:var(--stock-out)"></span></div>
    <div style="display:flex;gap:8px;font-size:13px;color:var(--text-secondary)"><span style="flex:1">accent · ok</span><span style="flex:1">stock-low · ≤ 7</span><span style="flex:1">stock-out · ≤ 3</span></div>
    <div style="display:flex;gap:3px"><span style="flex:1;height:8px;border-radius:9px;background:var(--stock-out)"></span><span style="flex:1;height:8px;border-radius:9px;background:var(--stock-out)"></span><span style="flex:1;height:8px;border-radius:9px;background:var(--fill-3)"></span><span style="flex:1;height:8px;border-radius:9px;background:var(--fill-3)"></span><span style="flex:1;height:8px;border-radius:9px;background:var(--fill-3)"></span><span style="flex:1;height:8px;border-radius:9px;background:var(--fill-3)"></span><span style="flex:1;height:8px;border-radius:9px;background:var(--fill-3)"></span></div>
  </div>
  <div data-theme="light" style="display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;background:var(--bg-primary);color:var(--text-primary)">
    <div style="display:flex;gap:8px"><span style="flex:1;height:36px;border-radius:12px;background:var(--accent)"></span><span style="flex:1;height:36px;border-radius:12px;background:var(--stock-low)"></span><span style="flex:1;height:36px;border-radius:12px;background:var(--stock-out)"></span></div>
    <div style="display:flex;gap:8px;font-size:13px;color:var(--text-secondary)"><span style="flex:1">accent · ok</span><span style="flex:1">stock-low · ≤ 7</span><span style="flex:1">stock-out · ≤ 3</span></div>
    <div style="display:flex;gap:3px"><span style="flex:1;height:8px;border-radius:9px;background:var(--stock-low)"></span><span style="flex:1;height:8px;border-radius:9px;background:var(--stock-low)"></span><span style="flex:1;height:8px;border-radius:9px;background:var(--stock-low)"></span><span style="flex:1;height:8px;border-radius:9px;background:var(--stock-low)"></span><span style="flex:1;height:8px;border-radius:9px;background:var(--stock-low)"></span><span style="flex:1;height:8px;border-radius:9px;background:var(--stock-low)"></span><span style="flex:1;height:8px;border-radius:9px;background:var(--fill-3)"></span></div>
  </div>
</div>
</body></html>
