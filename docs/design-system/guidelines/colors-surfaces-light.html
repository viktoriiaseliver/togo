<!DOCTYPE html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../graphite.css"></head>
<body style="background:var(--bg-primary);padding: 20px;box-sizing:border-box;min-height:100vh"><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px"><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--page);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">page</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--bg-primary);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">bg-primary</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--fill-sunken);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">fill-sunken</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--fill-1);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">fill-1</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--fill-2);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">fill-2</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--fill-3);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">fill-3</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--fill-selected);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">fill-selected</span></div><div style="display:flex;flex-direction:column;gap:8px"><div style="height:52px;border-radius:16px;background:var(--fill-inverse);box-shadow:inset 0 0 0 1px var(--separator)"></div><span style="font-size:12px;color:var(--text-secondary)">fill-inverse</span></div></div></body></html>
