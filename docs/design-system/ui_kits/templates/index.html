<!-- @dsCard group="UI kit" viewport="900x900" name="Шаблоны экранов" subtitle="Главная, список, деталь, настройки · умный дом / собака / лента" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graphite · универсальные шаблоны</title>
<link rel="stylesheet" href="../../graphite.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../components/preview-loader.js"></script>
<script src="presets.js"></script>
</head><body style="margin:0;padding:var(--space-24);box-sizing:border-box;background:var(--page);color:var(--text-primary);font-family:var(--font-text)">
<div id="root"></div>
<script type="text/babel" src="Templates.jsx"></script>
<script type="text/babel">
const KEY = "graphite-templates";
const AX = { XL: { "--fs-body": "19px", "--fs-subheadline": "17px", "--fs-footnote": "15px", "--fs-title-3": "22px", "--fs-title-2": "24px", "--fs-large-title": "36px", "--fs-headline": "19px" },
  AX1: { "--fs-body": "28px", "--fs-callout": "26px", "--fs-subheadline": "25px", "--fs-footnote": "23px", "--fs-caption-1": "22px", "--fs-headline": "28px", "--fs-title-3": "31px", "--fs-title-2": "32px", "--fs-title-1": "38px", "--fs-large-title": "44px" } };
const ALL = [...new Set(Object.values(AX).flatMap(Object.keys))];
function Seg({ value, onChange, options }) {
  return <div style={{ display: "flex", flexWrap: "wrap", background: "var(--fill-track)", borderRadius: 24, padding: "var(--space-4)", gap: "var(--space-4)" }}>{options.map(([v, l]) => <button key={v} onClick={() => onChange(v)} style={{ border: "none", cursor: "pointer", minHeight: 36, padding: "0 var(--space-12)", borderRadius: 999, fontSize: 13, background: value === v ? "var(--fill-selected)" : "transparent", color: value === v ? "var(--text-primary)" : "var(--text-secondary)" }}>{l}</button>)}</div>;
}
function App() {
  const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
  const [preset, setPreset] = React.useState(saved.preset || "dog");
  const [w, setW] = React.useState(saved.w || 390);
  const [theme, setTheme] = React.useState(saved.theme || "dark");
  const [accent, setAccent] = React.useState(saved.accent || "lime");
  const [fs, setFs] = React.useState(saved.fs || "L");
  const [state, setState] = React.useState("data");
  React.useEffect(() => { const h = document.documentElement; h.dataset.theme = theme; if (accent === "lime") delete h.dataset.accent; else h.dataset.accent = accent;
    ALL.forEach((k) => h.style.removeProperty(k)); Object.entries(AX[fs] || {}).forEach(([k, v]) => h.style.setProperty(k, v));
    localStorage.setItem(KEY, JSON.stringify({ preset, w, theme, accent, fs })); }, [preset, w, theme, accent, fs]);
  const compact = w < 375;
  return (
    <div style={{ display: "flex", gap: "var(--space-32)", flexWrap: "wrap", alignItems: "flex-start" }}>
      <div style={{ display: "flex", flexDirection: "column", gap: "var(--space-12)", width: 280 }}>
        <span style={{ fontFamily: "var(--font-rounded)", fontWeight: 300, fontSize: 36, letterSpacing: "-.02em" }}>Шаблоны</span>
        <span style={{ fontSize: 13, color: "var(--text-secondary)" }}>Продукт</span>
        <Seg value={preset} onChange={setPreset} options={Object.entries(window.PRESETS).map(([k, p]) => [k, p.name])} />
        <span style={{ fontSize: 13, color: "var(--text-secondary)" }}>Состояние данных</span>
        <Seg value={state} onChange={setState} options={[["data", "Данные"], ["loading", "Загрузка"], ["empty", "Пусто"], ["error", "Ошибка"], ["offline", "Нет сети"]]} />
        <span style={{ fontSize: 13, color: "var(--text-secondary)" }}>Экран и текст</span>
        <Seg value={w} onChange={setW} options={[[390, "390 pt"], [320, "320 pt"]]} />
        <Seg value={fs} onChange={setFs} options={[["L", "Текст L"], ["XL", "XL"], ["AX1", "AX1"]]} />
        <span style={{ fontSize: 13, color: "var(--text-secondary)" }}>Тема и акцент</span>
        <Seg value={theme} onChange={setTheme} options={[["dark", "Тёмная"], ["light", "Светлая"]]} />
        <Seg value={accent} onChange={setAccent} options={[["lime", "Лайм"], ["orange", "Оранж"], ["sky", "Небо"], ["pink", "Роза"]]} />
        <span style={{ fontSize: 13, lineHeight: 1.5, color: "var(--text-secondary)" }}>Четыре экрана из одних и тех же компонентов. Меняется только объект в presets.js: названия вкладок, тексты, иконки, данные. «Изменить» на списке — выбор, удаление с подтверждением и отменой.</span>
      </div>
      <div style={{ position: "relative", width: w, height: compact ? 640 : 844, background: "var(--bg-primary)", borderRadius: 44, boxShadow: "0 0 0 8px var(--fill-1), 0 0 0 9px var(--separator)", overflow: "hidden", flexShrink: 0 }}>
        <div style={{ position: "absolute", inset: 0, top: compact ? 24 : 52 }}>
          <window.TemplateApp key={preset} presetKey={preset} width={w} state={state} setState={setState} />
        </div>
      </div>
    </div>
  );
}
loadGraphite().then(() => ReactDOM.createRoot(document.getElementById("root")).render(<App />));
</script></body></html>
