<!-- @dsCard group="UI kit" viewport="1000x940" name="Togo · Финал" subtitle="Сегодня T5+ (4 состояния), запас по уровням, «Купил», удаление с отменой" -->
<!-- @startingPoint section="Togo" subtitle="«Сегодня» T5+ и Запас — финальный стиль" viewport="1000x940" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Togo · Финал</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../../components/preview-loader.js"></script>
</head><body style="margin:0;padding:24px;box-sizing:border-box;background:var(--page);color:var(--text-primary);font-family:var(--font-text)">
<div id="root"></div>
<script type="text/babel" src="TodayScreen.jsx"></script>
<script type="text/babel" src="StockScreen.jsx"></script>
<script type="text/babel">
const KEY = "togo-final-kit";
function Seg({ value, onChange, options }) {
  return <div style={{ display: "inline-flex", flexWrap: "wrap", background: "var(--fill-track)", borderRadius: 999, padding: 4, gap: 4 }}>{options.map(([v, l]) => <button key={v} onClick={() => onChange(v)} style={{ border: "none", cursor: "pointer", minHeight: 40, padding: "0 16px", borderRadius: 999, fontSize: 14, fontFamily: "inherit", background: value === v ? "var(--fill-selected)" : "transparent", color: value === v ? "var(--text-primary)" : "var(--text-secondary)" }}>{l}</button>)}</div>;
}
function Shell() {
  const { TabBar } = window.Graphite;
  const saved = JSON.parse(localStorage.getItem(KEY) || "{}");
  const [theme, setTheme] = React.useState(saved.theme || "dark");
  const [state, setState] = React.useState(saved.state || "normal");
  const [tab, setTab] = React.useState("today");
  const [sheet, setSheet] = React.useState(false);
  React.useEffect(() => { document.documentElement.dataset.theme = theme; localStorage.setItem(KEY, JSON.stringify({ theme, state })); }, [theme, state]);
  return (
    <div style={{ display: "flex", gap: 32, flexWrap: "wrap", alignItems: "flex-start" }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 12, width: 300 }}>
        <span style={{ fontFamily: "var(--font-rounded)", fontWeight: 300, fontSize: 36, letterSpacing: "-.02em" }}>Togo · Финал</span>
        <Seg value={theme} onChange={setTheme} options={[["dark", "Тёмная"], ["light", "Светлая"]]} />
        <Seg value={state} onChange={(v) => { setState(v); setTab("today"); }} options={[["normal", "Обычно"], ["fasting", "Натощак"], ["dose", "Час дозы"], ["alarm", "Тревога"]]} />
        <span style={{ fontSize: 14, lineHeight: 1.5, color: "var(--text-secondary)" }}>Прокрутите ленту — карточка сожмётся. Тап по записи — «Изменить / Удалить», удаление отменяется 5 с. «Записать…» — шторка. Вкладка «Здоровье» — запас и «Купил» со сроком годности.</span>
      </div>
      <div style={{ position: "relative", width: 402, height: 874, background: "var(--bg-primary)", borderRadius: 56, boxShadow: "0 0 0 10px #000, 0 0 0 11px #3A3A3A", overflow: "hidden", display: "flex", flexDirection: "column" }}>
        <div style={{ position: "absolute", left: "50%", top: 11, transform: "translateX(-50%)", width: 126, height: 37, borderRadius: 999, background: "var(--system-island)", zIndex: 9 }} />
        <div style={{ height: 62, flexShrink: 0, display: "flex", justifyContent: "space-between", alignItems: "center", padding: "0 34px 0 42px", fontSize: 17, fontWeight: 600 }}><span>9:41</span><span style={{ fontFamily: "var(--font-icon)", fontSize: 16 }}>battery_full</span></div>
        <div style={{ flex: 1, minHeight: 0 }}>{tab === "stock" ? <StockScreen /> : <TodayScreen key={state} state={state} onRecord={() => setSheet(true)} />}</div>
        <div style={{ padding: "12px 20px 28px" }}><TabBar value={tab === "stock" ? "stock" : "today"} onChange={(v) => setTab(v === "stock" ? "stock" : "today")} items={[{ value: "today", icon: "today", label: "Сегодня" }, { value: "h", icon: "history", label: "История" }, { value: "stock", icon: "monitor_heart", label: "Здоровье" }, { value: "d", icon: "pets", label: "Собака" }]} /></div>
        {sheet && <RecordSheet onClose={() => setSheet(false)} onPick={() => setSheet(false)} />}
      </div>
    </div>
  );
}
loadGraphite().then(() => ReactDOM.createRoot(document.getElementById("root")).render(<Shell />));
</script></body></html>
