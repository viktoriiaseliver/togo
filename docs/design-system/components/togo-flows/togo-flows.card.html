<!-- @dsCard group="Components" viewport="700x1500" name="Togo · сценарии" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../preview-loader.js"></script>
</head><body style="background:var(--bg-primary);padding: 20px;box-sizing:border-box">
<div id="root"></div>
<script type="text/babel">
loadGraphite().then((G) => {
  const L = ({ children }) => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{children}</span>;
  const Row = ({ children, gap = 8 }) => <div style={{ display: "flex", gap, flexWrap: "wrap", alignItems: "center" }}>{children}</div>;
  const Col = ({ children, gap = 10 }) => <div style={{ display: "flex", flexDirection: "column", gap }}>{children}</div>;
  function App() {
    const { OnboardingStep, PermissionCard, ReminderSchedule, ExportCard, InviteCard, TextField, ChoiceChips } = G; const grid = { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: "var(--space-12)", alignItems: "start" };
    const [name, setName] = React.useState("Стич"); const [mode, setMode] = React.useState("Лечение есть");
    const [rem, setRem] = React.useState([{ icon: "medication", title: "Доза", time: "07:00", repeat: "каждый день", on: true }, { icon: "pets", title: "Выход, если долго нет", time: "через 5 ч", on: true }, { icon: "restaurant", title: "Корм заканчивается", time: "за 5 дней", on: false }]);
    const [quiet, setQuiet] = React.useState(true); const [crit, setCrit] = React.useState(true);
    const [fmt, setFmt] = React.useState("PDF врачу"); const [inc, setInc] = React.useState([{ label: "Выходы и стул", on: true }, { label: "Дозы и пропуски", on: true }, { label: "Эпизоды", on: true }, { label: "Анализы Т4 / ТТГ", on: false }]);
    return (<Col gap={18}>
      <div style={grid}>
        <Col><L>OnboardingStep · 1 из 3</L><div style={{ background: "var(--bg-primary)", borderRadius: 28, padding: "var(--space-20)", boxShadow: "inset 0 0 0 1px var(--separator)" }}><OnboardingStep step={1} total={3} title="Как зовут собаку?" body="Имя будет в напоминаниях и отчёте врачу." primary="Дальше"><TextField value={name} onChange={setName} placeholder="Имя" /></OnboardingStep></div></Col>
        <Col><L>OnboardingStep · 3 из 3, можно пропустить</L><div style={{ background: "var(--bg-primary)", borderRadius: 28, padding: "var(--space-20)", boxShadow: "inset 0 0 0 1px var(--separator)" }}><OnboardingStep step={3} total={3} icon="medication" title="Есть лечение?" body="Включит дозы, окно натощак и вкладку «Здоровье». Можно позже в профиле." primary="Начать" secondary="Пропустить"><ChoiceChips options={["Лечение есть", "Нет"]} value={mode} onChange={setMode} /></OnboardingStep></div></Col>
      </div>
      <Col><L>PermissionCard · спросить / отказано / разрешено</L><div style={grid}>
        <PermissionCard title="Уведомления" reason="Чтобы доза по часам и окно натощак не прошли мимо." onLater={() => {}} />
        <PermissionCard title="Уведомления" state="denied" />
        <PermissionCard icon="location_on" title="Геопозиция" reason="Только во время прогулки, чтобы записать маршрут." state="granted" />
      </div></Col>
      <div style={grid}>
        <Col><L>ReminderSchedule</L><ReminderSchedule items={rem} onToggle={(i, v) => setRem(rem.map((x, j) => (j === i ? { ...x, on: v } : x)))} quiet={{ on: quiet, from: "23:00", to: "07:00" }} onQuiet={setQuiet} critical={crit} onCritical={setCrit} /></Col>
        <Col><L>ExportCard</L><ExportCard range="23 сен – 2 окт" format={fmt} onFormat={setFmt} includes={inc} onToggleInclude={(i) => setInc(inc.map((x, j) => (j === i ? { ...x, on: !x.on } : x)))} /></Col>
      </div>
      <Col><L>InviteCard · ждёт / ссылка устарела / готово</L><div style={grid}>
        <InviteCard from="Вика" dog="Стич" />
        <InviteCard from="Вика" dog="Стич" state="expired" />
        <InviteCard from="Вика" dog="Стич" state="joined" />
      </div></Col>
    </Col>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script></body></html>
