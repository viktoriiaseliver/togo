<!-- @dsCard group="Components" viewport="700x640" name="Данные" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../graphite.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../preview-loader.js"></script>
</head><body style="background:var(--bg-primary);padding: 20px;box-sizing:border-box">
<div id="root"></div>
<script type="text/babel">
loadGraphite().then((G) => {
  const L = ({ children }) => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{children}</span>;
  const Row = ({ children, gap = 8 }) => <div style={{ display: "flex", gap, flexWrap: "wrap", alignItems: "center" }}>{children}</div>;
  const Col = ({ children, gap = 10 }) => <div style={{ display: "flex", flexDirection: "column", gap }}>{children}</div>;
  function App() {
    const { Timeline, WeekChart } = G; const grid = { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: "var(--space-12)", alignItems: "start" };
    return (<div style={grid}>
      <Col><L>Timeline</L><Timeline items={[{ type: "now", time: "12:40" }, { type: "gap", label: "4 ч 30 мин без выхода", warn: true }, { time: "08:10", icon: "pets", title: "Выход", detail: "Как попросил: у двери", who: "Мама" }, { time: "07:45", icon: "restaurant", title: "Корм", detail: "Завтрак" }, { type: "gap", label: "40 мин окно натощак" }, { time: "07:05", icon: "medication", title: "Доза", detail: "Левотироксин 200 мкг", tone: "done" }, { time: "06:50", icon: "eco", title: "Стул", detail: "Удалено", deleted: true }]} /></Col>
      <Col gap={10}><L>WeekChart · выходов в день, пунктир — норма</L><WeekChart unit="выходов" target={5} data={[{ label: "пн", value: 5 }, { label: "вт", value: 6 }, { label: "ср", value: null }, { label: "чт", value: 4 }, { label: "пт", value: 5 }, { label: "сб", value: 7 }, { label: "вс", value: 3, active: true }]} /></Col>
    </div>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script></body></html>
