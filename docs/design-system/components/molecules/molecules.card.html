<!-- @dsCard group="Components" viewport="700x620" name="Молекулы" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../graphite.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../preview-loader.js"></script>
</head><body style="background:var(--bg-primary);padding: 20px;box-sizing:border-box">
<div id="root"></div>
<script type="text/babel">
loadGraphite().then((G) => {
  const L = ({ children }) => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{children}</span>;
  const Row = ({ children, gap = 8 }) => <div style={{ display: "flex", gap, flexWrap: "wrap", alignItems: "center" }}>{children}</div>;
  const Col = ({ children, gap = 10 }) => <div style={{ display: "flex", flexDirection: "column", gap }}>{children}</div>;
  function App() {
    const { StatusChip, Metric, ListRow, SegmentedControl, Stepper, SlideAction, Toast, SearchField, Toggle, Icon } = G;
    const [seg, setSeg] = React.useState("d"); const [seg2, setSeg2] = React.useState("g"); const [t, setT] = React.useState(25); const [q, setQ] = React.useState("спа"); const [n, setN] = React.useState(true);
    return (<Col gap={18}>
      <Col><L>StatusChip · ок / внимание / ошибка / выкл / загрузка</L><Row gap={6}><StatusChip icon="shield" title="Охрана" status="Всё закрыто" /><StatusChip icon="light" title="Свет" status="2 включено" tone="warning" /><StatusChip icon="videocam" title="Камеры" status="Нет связи" tone="error" /><StatusChip icon="mode_fan" title="Климат" status="Выключено" tone="off" /><StatusChip loading /></Row></Col>
      <Row gap={28}><Col><L>Metric</L><Row gap={24}><Metric value={54} unit="%" /><Metric value={null} /><Metric value={12} size="m" caption="Всего устройств" /></Row></Col>
        <Col><L>Stepper</L><Stepper value={t} onChange={setT} min={16} max={30} unit="°" /></Col></Row>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "var(--space-16)" }}>
        <Col gap={6}><L>ListRow</L><ListRow icon="kitchen" title="Кухня" subtitle="3 устройства" chevron /><ListRow title="Единицы" value="°C" chevron /><ListRow title="Уведомления" trailing={<Toggle checked={n} onChange={setN} />} /><ListRow title="Удалить комнату" destructive /></Col>
        <Col gap={10}><L>SegmentedControl</L><SegmentedControl value={seg} onChange={setSeg} options={[{ value: "d", label: "День" }, { value: "w", label: "Неделя" }, { value: "m", label: "Месяц" }]} />
          <SegmentedControl value={seg2} onChange={setSeg2} options={[{ value: "g", label: "Сетка", icon: "grid_view" }, { value: "l", label: "Список", icon: "view_agenda" }]} />
          <L>SearchField</L><SearchField value={q} onChange={setQ} onCancel={() => setQ("")} />
          <L>SlideAction</L><SlideAction label="Уйти из дома" /></Col>
      </div>
      <Col><L>Toast · отмена / инфо / ошибка</L><div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: "var(--space-8)" }}><Toast text="«Кухня» удалена" actionLabel="Отменить" /><Toast tone="info" text="Изменения сохранены" /><Toast tone="error" text="Не удалось" actionLabel="Повторить" /></div></Col>
    </Col>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script></body></html>
