<!-- @dsCard group="Components" viewport="700x2300" name="Togo" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../preview-loader.js"></script>
</head><body style="background:var(--bg-primary);padding: 20px;box-sizing:border-box">
<div id="root"></div>
<script type="text/babel">
loadGraphite().then((G) => {
  const L = ({ children }) => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{children}</span>;
  const Row = ({ children, gap = 8 }) => <div style={{ display: "flex", gap, flexWrap: "wrap", alignItems: "center" }}>{children}</div>;
  const Col = ({ children, gap = 10 }) => <div style={{ display: "flex", flexDirection: "column", gap }}>{children}</div>;
  function App() {
    const { QuickLog, VerdictCard, WalkBar, DoseCard, FastingWindow, MergeCard, EmergencyCard, DiaryEntry, TrainingTimer, MorningBrief, DogSwitcher, ProCard } = G;
    const [marks, setMarks] = React.useState({ pee: 1, poo: 0 });
    const grid = { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(288px, 1fr))", gap: "var(--space-8)" };
    return (<Col gap={18}>
      <Col><L>QuickLog</L><QuickLog items={[{ value: "out", label: "Выход", icon: "pets", since: "2 ч 10 мин" }, { value: "food", label: "Корм", icon: "restaurant", since: "5 ч" }, { value: "stool", label: "Стул", icon: "eco", since: "вчера" }]} /></Col>
      <Col><L>VerdictCard · срочно / похоже / непонятно / внимание / эпизод</L><div style={grid}>
        <VerdictCard outcome="urgent" reason="Последний выход 6 ч назад, обычно 3 ч" onLater={() => {}} />
        <VerdictCard outcome="likely" reason="Последний выход 3 ч 40 мин назад, обычно 3 ч" onLater={() => {}} />
        <VerdictCard outcome="unclear" reason="Мало данных: нужно хотя бы 4 дня записей" />
        <VerdictCard outcome="attention" reason="Выводили 40 мин назад, всё сделал" onLater={() => {}} />
        <VerdictCard outcome="episode" reason="Третий жидкий стул за день" onLater={() => {}} /></div></Col>
      <Col><L>DoseCard · пора / дано / пропущена / натощак · FastingWindow</L><div style={grid}>
        <DoseCard state="due" name="Левотироксин" dose="200 мкг · 1 таблетка" time="07:00" />
        <DoseCard state="taken" name="Левотироксин" dose="200 мкг" time="07:10" note="Уже дал в 07:10 — вторую не запишу" onUndo={() => {}} />
        <DoseCard state="overdue" name="Левотироксин" dose="200 мкг" time="19:00" note="Пропущена на 1 ч 20 мин" />
        <Col gap={6}><FastingWindow phase="after" minutesLeft={25} progress={0.4} until="07:40" /><FastingWindow phase="before" minutesLeft={50} progress={0.15} until="07:00" /></Col></div></Col>
      <div style={grid}>
        <Col><L>WalkBar</L><WalkBar elapsed="12:40" marks={[{ value: "pee", label: "Пописал", count: marks.pee }, { value: "poo", label: "Покакал", count: marks.poo }, { value: "train", label: "Занятие" }]} onMark={(v) => setMarks((m) => ({ ...m, [v]: (m[v] || 0) + 1 }))} /></Col>
        <Col><L>MergeCard</L><MergeCard first={{ what: "Выход", who: "Ты", time: "08:10" }} second={{ what: "Выход", who: "Мама", time: "08:18" }} /></Col>
        <Col><L>EmergencyCard</L><EmergencyCard vetName="Ветклиника" phone="+33 4 93 00 00 00" callNow={["Кровь в стуле или рвоте", "Не ест больше суток"]} watch={["Один мягкий стул"]} onReport={() => {}} /></Col>
        <Col gap={6}><L>DiaryEntry</L><DiaryEntry time="08:10" icon="pets" title="Выход" detail="Как попросил: у двери" who="Мама" /><DiaryEntry time="07:10" icon="medication" title="Доза" detail="Левотироксин 200 мкг" tone="done" /><DiaryEntry time="06:50" icon="eco" title="Стул" detail="Нормальный" deleted /></Col>
      </div>
      <div style={grid}>
        <Col><L>TrainingTimer</L><TrainingTimer skill="Место" elapsed="01:20" reps={6} lastDelayMs={640} /></Col>
        <Col><L>MorningBrief</L><MorningBrief items={["Ночью мама выводила в 03:10", "Корм заканчивается через 4 дня"]} onOpen={() => {}} onDismiss={() => {}} /></Col>
        <Col><L>DogSwitcher</L><DogSwitcher dogs={[{ id: "s", name: "Стич" }, { id: "b", name: "Бублик" }]} value="s" onAdd={() => {}} /></Col>
        <Col><L>ProCard</L><ProCard price="2,99 € в месяц" onRestore={() => {}} /></Col>
      </div>
    </Col>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script></body></html>
