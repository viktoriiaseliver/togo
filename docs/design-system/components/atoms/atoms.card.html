<!-- @dsCard group="Components" viewport="700x900" name="Атомы" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../graphite.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../preview-loader.js"></script>
</head><body style="background:var(--bg-primary);padding: 20px;box-sizing:border-box">
<div id="root"></div>
<script type="text/babel">
loadGraphite().then((G) => {
  const L = ({ children }) => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{children}</span>;
  const Row = ({ children, gap = 8 }) => <div style={{ display: "flex", gap, flexWrap: "wrap", alignItems: "center" }}>{children}</div>;
  const Col = ({ children, gap = 10 }) => <div style={{ display: "flex", flexDirection: "column", gap }}>{children}</div>;
  function App() {
    const { Button, IconButton, Toggle, SelectCircle, Badge, TextField, ProgressBar, Skeleton, Icon } = G;
    const [on, setOn] = React.useState(true); const [sel, setSel] = React.useState(true); const [v, setV] = React.useState("Кухня");
    return (<Col gap={18}>
      <Col><L>Button · формы: текст / иконка + текст / текст + иконка / только иконка</L>
        <div style={{ display: "grid", gridTemplateColumns: "minmax(0,110px) repeat(4, auto) 1fr", gap: "var(--space-12) var(--space-8)", alignItems: "center", justifyItems: "start" }}>
          {["primary", "secondary", "tinted", "surface", "destructive", "destructive-filled", "plain"].map((v) => (<React.Fragment key={v}>
            <L>{v}</L>
            <Button variant={v}>{v.startsWith("destructive") ? "Удалить" : "Записать"}</Button>
            <Button variant={v} icon={v.startsWith("destructive") ? "delete" : "add"}>{v.startsWith("destructive") ? "Удалить" : "Добавить"}</Button>
            <Button variant={v} icon="chevron_right" iconPosition="trailing">Дальше</Button>
            <Button variant={v} icon={v.startsWith("destructive") ? "delete" : "settings"} label="Действие" />
            <span />
          </React.Fragment>))}
        </div></Col>
      <Col><L>Размеры s · m · l · xl</L><Row><Button size="s">Маленькая</Button><Button size="m" icon="add">Средняя</Button><Button size="l">Большая</Button><Button size="xl" icon="pets">Вывожу</Button><Button size="s" icon="close" label="Закрыть" variant="secondary" /><Button size="m" icon="close" label="Закрыть" variant="secondary" /><Button size="l" icon="close" label="Закрыть" variant="secondary" /><Button size="xl" icon="mic" label="Голос" /></Row></Col>
      <Col><L>Состояния · обычное / выбрано / загрузка / неактивно</L><Row><Button>Сохранить</Button><Button variant="surface" icon="grid_view" label="Сетка" selected /><Button loading>Сохранить</Button><Button loading icon="send">Отправить</Button><Button icon="add" label="Добавить" loading /><Button disabled>Сохранить</Button><Button disabled icon="add">Добавить</Button><Button disabled icon="add" label="Добавить" variant="surface" /></Row></Col>
      <Col><L>Toggle · SelectCircle</L><Row><Toggle checked={on} onChange={setOn} label="Тумблер" /><Toggle checked={false} /><Toggle checked disabled />
          <SelectCircle checked={sel} onChange={setSel} /><SelectCircle checked={false} /><SelectCircle checked={false} disabled /></Row></Col>
      <Col><L>Badge · Icon</L><Row><Badge tone="accent">В сети</Badge><Badge>58 %</Badge><Badge tone="warning">Обновляется</Badge><Badge tone="error">Нет связи</Badge><Icon name="home" fill color="var(--accent-text)" /><Icon name="notifications" /></Row></Col>
      <Col><L>TextField · заполнено / ошибка / disabled</L>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: "var(--space-8)" }}><TextField value={v} onChange={setV} placeholder="Название" /><TextField value="" placeholder="Название" error="Название не может быть пустым" /><TextField value="Только чтение" disabled /></div></Col>
      <Col><L>ProgressBar · Skeleton</L><div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: "var(--space-16)", alignItems: "center" }}><Col gap={8}><ProgressBar value={0} /><ProgressBar value={60} /><ProgressBar value={100} /></Col><Row gap={10}><Skeleton width={44} height={44} round /><Col gap={8}><Skeleton width={180} /><Skeleton width={100} height={10} /></Col></Row></div></Col>
    </Col>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script></body></html>
