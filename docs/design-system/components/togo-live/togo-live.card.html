<!-- @dsCard group="Components" viewport="700x1000" name="Togo · режимы и виджеты" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../preview-loader.js"></script>
</head><body style="background:var(--bg-primary);padding: 20px;box-sizing:border-box">
<div id="root"></div>
<script type="text/babel">
loadGraphite().then((G) => {
  const L = ({ children }) => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{children}</span>;
  const Row = ({ children, gap = 8 }) => <div style={{ display: "flex", gap, flexWrap: "wrap", alignItems: "center" }}>{children}</div>;
  const Col = ({ children, gap = 10 }) => <div style={{ display: "flex", flexDirection: "column", gap }}>{children}</div>;
  function App() {
    const { EscalationLadder, EpisodeCard, TripCard, WidgetPreview, LiveActivity } = G; const grid = { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: "var(--space-12)", alignItems: "start" };
    const [c, setC] = React.useState([{ label: "Левотироксин на 8 дней" }, { label: "Ветпаспорт", done: true }, { label: "Корм на дорогу" }]);
    return (<Col gap={18}><div style={grid}>
      <Col><L>EscalationLadder</L><EscalationLadder current={1} steps={[{ who: "Ты", how: "Уведомление", time: "07:00" }, { who: "Ты", how: "Повтор, критическое", time: "07:15" }, { who: "Мама", how: "Дежурному", time: "07:30" }]} /></Col>
      <Col><L>EpisodeCard</L><EpisodeCard title="Жидкий стул" started="09:20" count={3} signs={["Ест", "Пьёт", "Активный"]} onCall={() => {}} onEnd={() => {}} /></Col>
      <Col><L>TripCard</L><TripCard place="Лион" dates="12–19 окт" daysLeft={5} checklist={c} onToggle={(i) => setC(c.map((x, j) => (j === i ? { ...x, done: !x.done } : x)))} /></Col>
    </div>
    <Col><L>WidgetPreview · small / medium</L><Row gap={12}><WidgetPreview since="2 ч 10" verdict="Похоже на нужду" /><WidgetPreview size="medium" since="2 ч 10" verdict="Похоже на нужду" next="Доза в 19:00" /></Row></Col>
    <Col><L>LiveActivity · экран блокировки / Dynamic Island</L><div style={grid}><LiveActivity title="Прогулка" elapsed="12:40" detail="Пописал · 1" /><LiveActivity kind="fast" title="Окно натощак" elapsed="25 мин" detail="Кормить в 07:40" /></div><Row><LiveActivity island elapsed="12:40" /><LiveActivity island kind="fast" elapsed="25 мин" /></Row></Col>
    </Col>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script></body></html>
