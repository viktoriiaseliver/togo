<!-- @dsCard group="Components" viewport="700x700" name="Выбор даты и времени" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../graphite.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../preview-loader.js"></script>
</head><body style="background:var(--bg-primary);padding: 20px;box-sizing:border-box">
<div id="root"></div>
<script type="text/babel">
loadGraphite().then((G) => {
  const L = ({ children }) => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{children}</span>;
  const Row = ({ children, gap = 8 }) => <div style={{ display: "flex", gap, flexWrap: "wrap", alignItems: "center" }}>{children}</div>;
  const Col = ({ children, gap = 10 }) => <div style={{ display: "flex", flexDirection: "column", gap }}>{children}</div>;
  function App() {
    const { Calendar, WeekStrip, TimeField, DateRow } = G; const grid = { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: "var(--space-12)", alignItems: "start" };
    const today = new Date(); const [d, setD] = React.useState(today); const [t, setT] = React.useState("08:10");
    const k = (x) => x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
    const marks = {}; for (let i = 1; i < 12; i++) { const x = new Date(today); x.setDate(today.getDate() - i); marks[k(x)] = i === 3 ? "overdue" : "done"; }
    const now = today.getHours() * 60 + today.getMinutes();
    return (<Col gap={18}>
      <Col><L>WeekStrip</L><WeekStrip value={d} onChange={setD} marks={marks} /></Col>
      <div style={grid}>
        <Col><L>Calendar · точка — записи, красная — пропущенная доза</L><Calendar value={d} onChange={setD} marks={marks} max={today} /></Col>
        <Col gap={10}><L>TimeField</L><TimeField value={t} onChange={setT} quick={[{ label: "Сейчас", minutes: now }, { label: "15 мин назад", minutes: now - 15 }, { label: "30 мин назад", minutes: now - 30 }]} />
          <L>DateRow</L><DateRow label="Время" value={"Сегодня, " + t} /><DateRow icon="date_range" label="Поездка" value="12–19 окт" /></Col>
      </div>
    </Col>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script></body></html>
