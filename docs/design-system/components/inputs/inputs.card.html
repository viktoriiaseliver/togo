<!-- @dsCard group="Components" viewport="700x1100" name="Ввод, медиа, состояния" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../graphite.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../preview-loader.js"></script>
</head><body style="background:var(--bg-primary);padding: 20px;box-sizing:border-box">
<div id="root"></div>
<script type="text/babel">
loadGraphite().then((G) => {
  const L = ({ children }) => <span style={{ fontSize: 12, color: "var(--text-secondary)" }}>{children}</span>;
  const Row = ({ children, gap = 8 }) => <div style={{ display: "flex", gap, flexWrap: "wrap", alignItems: "center" }}>{children}</div>;
  const Col = ({ children, gap = 10 }) => <div style={{ display: "flex", flexDirection: "column", gap }}>{children}</div>;
  function App() {
    const { TextArea, Menu, Slider, Avatar, AvatarGroup, MediaGrid, ListSkeleton, RefreshIndicator, SyncStatus } = G; const grid = { display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(300px, 1fr))", gap: 12, alignItems: "start" };
    const [t, setT] = React.useState("Ел траву на прогулке"); const [b, setB] = React.useState("Шипперке"); const [s, setS] = React.useState(5);
    return (<Col gap={20}>
      <div style={grid}>
        <Col><L>TextArea · обычное / ошибка / неактивно</L><TextArea label="Заметка" value={t} onChange={setT} max={120} /><TextArea label="Вопрос врачу" value="" placeholder="Что спросить" error="Напиши хотя бы пару слов" /><TextArea label="Только чтение" value="Записала мама" disabled rows={1} /></Col>
        <Col><L>Menu · Slider</L><Menu label="Порода" value={b} onChange={setB} options={["Шипперке", "Шпиц", "Метис", "Другая"]} /><Menu label="Врач" options={["Д-р Мартен", "Клиника Арсон"]} /><Menu label="Неактивно" value="Стич" options={["Стич"]} disabled />
          <div style={{ background: "var(--fill-1)", borderRadius: "var(--radius-row)", padding: "var(--pad-inner) var(--pad-row)", boxShadow: "var(--elev-1)" }}><Slider label="Напомнить, если нет выхода" value={s} min={2} max={8} onChange={setS} format={(v) => v + " ч"} marks={["2 ч", "8 ч"]} /></div></Col>
      </div>
      <Col><L>Avatar · s / m / l / xl · дежурный · AvatarGroup</L><Row gap={12}><Avatar name="Вика" size="s" /><Avatar name="Вика Мама" /><Avatar name="Тео" size="l" ring /><Avatar name="Стич" icon="pets" size="xl" /><AvatarGroup people={[{ name: "Вика" }, { name: "Мама" }, { name: "Тео" }, { name: "Папа" }]} /></Row></Col>
      <Col><L>MediaGrid · фото, файл, загрузка, добавить</L><MediaGrid items={[{ caption: "09:20" }, { kind: "file", caption: "IDEXX" }, { caption: "Загрузка", uploading: true }]} onAdd={() => {}} /></Col>
      <div style={grid}>
        <Col><L>ListSkeleton · RefreshIndicator</L><RefreshIndicator state="loading" /><ListSkeleton rows={3} /><RefreshIndicator updated="2 мин назад" /></Col>
        <Col><L>SyncStatus</L><Col gap={8}><SyncStatus /><SyncStatus state="pending" detail="у мамы ещё нет" /><SyncStatus state="offline" detail="3 записи" /><SyncStatus state="error" onRetry={() => {}} /></Col></Col>
      </div>
    </Col>);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
});
</script></body></html>
