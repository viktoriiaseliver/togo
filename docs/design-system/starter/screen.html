<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Новый экран</title>
<link rel="stylesheet" href="../graphite.css">
<link rel="stylesheet" href="brand.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../components/preview-loader.js"></script>
</head>
<body style="margin: 0;background:var(--page);display:flex;justify-content:center;padding:24px 0">
<div id="root"></div>
<script type="text/babel">
loadGraphite().then((G) => {
  const { NavBar, TabBar, Card, CardHeader, ListRow, ActionRow, Button, SectionHeader, Toast } = G;
  function Screen() {
    const [tab, setTab] = React.useState("home");
    const [toast, setToast] = React.useState(null);
    const W = 390, pad = W < 375 ? 16 : 20;
    return (
      <div style={{ position: "relative", width: W, height: 844, background: "var(--bg-primary)", borderRadius: 48, overflow: "hidden", color: "var(--text-primary)" }}>
        <div style={{ position: "absolute", inset: 0, overflowY: "auto", padding: `56px ${pad}px 120px`, display: "flex", flexDirection: "column", gap: "var(--gap-sections)" }}>
          <NavBar title="Главная" trailing={<Button icon="settings" label="Настройки" variant="surface" size="m" />} />
          <Card>
            <CardHeader icon="bolt" tone="accent" kicker="Главное" title="Заголовок карточки" subtitle="Одна фраза о том, что происходит." />
            <ActionRow>
              <Button onClick={() => setToast("Сделано")}>Главное действие</Button>
              <Button variant="secondary">Второе</Button>
            </ActionRow>
          </Card>
          <div style={{ display: "flex", flexDirection: "column", gap: "var(--gap-cards)" }}>
            <SectionHeader title="Список" action="Все" />
            <ListRow icon="star" title="Строка" subtitle="Подпись" chevron onClick={() => {}} />
            <ListRow icon="schedule" title="Ещё строка" value="08:00" />
          </div>
        </div>
        {toast && <Toast tone="undo" text={toast} actionLabel="Отменить" onAction={() => setToast(null)} style={{ position: "absolute", left: pad, right: pad, bottom: 100 }} />}
        <TabBar value={tab} onChange={setTab} items={[{ value: "home", icon: "home", label: "Главная" }, { value: "list", icon: "list", label: "Список" }, { value: "me", icon: "person", label: "Профиль" }]} style={{ position: "absolute", left: pad, right: pad, bottom: 24 }} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Screen />);
});
</script>
</body>
</html>
