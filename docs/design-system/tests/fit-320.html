<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<title>Проверка 320 pt</title>
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>
<script src="../components/preview-loader.js"></script>
</head>
<body style="margin:0;background:var(--page);color:var(--text-primary);font-family:var(--font-text)">
<div id="root"></div>
<script type="text/babel">
const Q = new URLSearchParams(location.search);
const FS = Q.get("fs") || (location.hash.includes("ax") ? "AX1" : "L");
if (Q.get("theme") === "light" || location.hash.includes("light")) document.documentElement.dataset.theme = "light";
const AX = { "--fs-body": "28px", "--fs-callout": "26px", "--fs-subheadline": "25px", "--fs-footnote": "23px", "--fs-caption-1": "22px", "--fs-caption-2": "22px", "--fs-headline": "28px", "--fs-title-3": "31px", "--fs-title-2": "32px", "--fs-title-1": "38px", "--fs-large-title": "44px" };
if (FS === "AX1") Object.entries(AX).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
loadGraphite().then((G) => {
  const n = () => {};
  const today = new Date();
  const cases = [
    ["Button ряд", <G.ActionRow><G.Button>Вывожу</G.Button><G.Button variant="secondary">Не сейчас</G.Button></G.ActionRow>],
    ["Button формы", <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}><G.Button icon="add">Добавить</G.Button><G.Button icon="chevron_right" iconPosition="trailing">Дальше</G.Button><G.Button icon="settings" label="Настройки" variant="surface" /><G.Button size="xl" icon="pets">Вывожу</G.Button></div>],
    ["Badge/Toggle", <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "center" }}><G.Badge tone="accent">В сети</G.Badge><G.Toggle checked label="t" /><G.SelectCircle checked /></div>],
    ["TextField", <G.TextField value="Стич" onChange={n} />],
    ["TextArea", <G.TextArea label="Заметка" value="Ел траву на прогулке" max={120} />],
    ["Menu", <G.Menu label="Порода" value="Шипперке" options={["Шипперке"]} />],
    ["Slider", <G.Slider label="Напомнить, если нет выхода" value={5} min={2} max={8} format={(v) => v + " ч"} marks={["2 ч", "8 ч"]} />],
    ["SegmentedControl", <G.SegmentedControl value="day" onChange={n} options={[{ value: "day", label: "День" }, { value: "week", label: "Неделя" }]} />],
    ["ChoiceChips", <G.ChoiceChips options={["У двери", "Скулил", "Не просил"]} value="Скулил" />],
    ["SectionHeader", <G.SectionHeader title="Лечение" action="Все дозы" />],
    ["ListRow", <G.ListRow icon="pets" title="Уведомления дежурному" subtitle="Каждые 15 минут" value="Вкл" chevron />],
    ["ListRow toggle", <G.ListRow icon="bedtime" title="Тихие часы" subtitle="23:00–07:00 · ждёт утреннего брифа" trailing={<G.Toggle checked label="t" />} />],
    ["Card+Header", <G.Card><G.CardHeader icon="luggage" tone="accent" kicker="Поездка · 12–19 окт" title="Лион" trailing={<span>через 5 дн.</span>} /></G.Card>],
    ["Toast", <G.Toast tone="undo" text="Запись удалена" actionLabel="Отменить" />],
    ["StatusChip", <G.StatusChip icon="router" title="Роутер в гостиной" status="Нет связи · 12 мин" tone="error" />],
    ["Metric", <G.Metric value="7,4" unit="кг" label="Вес" />],
    ["Stepper", <G.Stepper value={2} onChange={n} />],
    ["SearchField", <G.SearchField value="" onChange={n} placeholder="Поиск" />],
    ["NavBar", <G.NavBar title="Сегодня" trailing={<G.Button icon="settings" label="s" variant="surface" size="m" />} />],
    ["FitHeader узкий", <G.FitHeader leading={<G.Button variant="plain">Все</G.Button>} title="Выбрано: 12" trailing={<G.Button variant="plain">Готово</G.Button>} />],
    ["FitHeader", <G.FitHeader leading={<G.Button variant="plain">Отмена</G.Button>} title="Выбрано: 2" trailing={<G.Button variant="plain">Готово</G.Button>} />],
    ["TabBar", <G.TabBar value="a" onChange={n} items={[{ value: "a", icon: "home", label: "Сегодня" }, { value: "b", icon: "history", label: "История" }, { value: "c", icon: "pets", label: "Собака" }, { value: "d", icon: "group", label: "Семья" }]} />],
    ["EmptyState", <G.EmptyState icon="pets" title="Пока пусто" text="Первая запись появится здесь" action="Записать" />],
    ["Alert", <G.Alert inline title="Закончить прогулку?" message="Ты не отметил ни одного дела." actions={[{ label: "Продолжить", style: "cancel" }, { label: "Закончить" }]} />],
    ["InlineAlert", <G.InlineAlert tone="warning" title="Уведомления выключены" message="Без них доза по часам не напомнит" actionLabel="Открыть настройки" onClose={n} />],
    ["Push", <G.PushNotification title="Доза Стичу" body="Левотироксин 200 мкг, 07:00" actions={[{ label: "Дал" }, { label: "Через 10 мин" }]} />],
    ["ContextMenu", <G.ContextMenu items={[{ label: "Изменить время", icon: "schedule" }, { label: "Удалить", icon: "delete", destructive: true, group: true }]} />],
    ["Calendar", <G.Calendar value={today} max={today} today={today} />],
    ["WeekStrip", <G.WeekStrip value={today} today={today} />],
    ["TimeField", <G.TimeField value="08:10" quick={[{ label: "Сейчас", minutes: 600 }, { label: "15 мин назад", minutes: 585 }]} />],
    ["DateRow", <G.DateRow label="Время" value="Сегодня, 08:10" />],
    ["Timeline", <G.Timeline items={[{ type: "now", time: "12:40" }, { type: "gap", label: "4 ч 30 мин без выхода", warn: true }, { time: "08:10", icon: "pets", title: "Выход", detail: "Как попросил: у двери", who: "Мама" }]} />],
    ["WeekChart", <G.WeekChart unit="выходов" target={5} data={["пн", "вт", "ср", "чт", "пт", "сб", "вс"].map((l, i) => ({ label: l, value: i === 2 ? null : 4 + (i % 3), active: i === 6 }))} />],
    ["QuickLog", <G.QuickLog onLog={n} items={[{ value: "out", label: "Выход", icon: "pets", since: "2 ч назад" }, { value: "food", label: "Корм", icon: "restaurant", since: "5 ч" }, { value: "stool", label: "Стул", icon: "eco" }, { value: "water", label: "Вода", icon: "water_drop" }]} />],
    ["VerdictCard", <G.VerdictCard verdict="likely" since="4 ч 10 мин" onWalkOut={n} onLater={n} />],
    ["WalkBar", <G.WalkBar elapsed="12:40" marks={[{ value: "pee", label: "Пописал", count: 1 }, { value: "poo", label: "Покакал" }, { value: "play", label: "Играл" }]} onMark={n} onFinish={n} />],
    ["DoseCard", <G.DoseCard state="overdue" name="Левотироксин" dose="200 мкг" time="07:00" onGive={n} />],
    ["FastingWindow", <G.FastingWindow minutesLeft={25} />],
    ["MergeCard", <G.MergeCard first={{ time: "08:10", who: "Мама" }} second={{ time: "08:20", who: "Вика" }} onMerge={n} onKeep={n} />],
    ["EmergencyCard", <G.EmergencyCard onCall={n} />],
    ["DiaryEntry", <G.DiaryEntry icon="pets" title="Выход" detail="Как попросил: у двери" who="Мама" time="08:10" />],
    ["TrainingTimer", <G.TrainingTimer skill="Место" elapsed="01:20" reps={6} lastDelayMs={640} />],
    ["MorningBrief", <G.MorningBrief items={["Ночью мама выводила в 03:10"]} onOpen={n} onDismiss={n} />],
    ["DogSwitcher", <G.DogSwitcher dogs={[{ id: "s", name: "Стич" }, { id: "b", name: "Бублик" }]} value="s" onAdd={n} />],
    ["ProCard", <G.ProCard price="2,99 € в месяц" onRestore={n} />],
    ["EscalationLadder", <G.EscalationLadder current={1} steps={[{ who: "Ты", how: "Уведомление", time: "07:00" }, { who: "Мама", how: "Дежурному", time: "07:30" }]} />],
    ["EpisodeCard", <G.EpisodeCard title="Жидкий стул" started="09:20" count={3} signs={["Ест", "Пьёт"]} onCall={n} onEnd={n} />],
    ["TripCard", <G.TripCard place="Лион" dates="12–19 окт" daysLeft={5} checklist={[{ label: "Левотироксин на 8 дней" }]} />],
    ["Widget", <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}><G.WidgetPreview since="2 ч 10" verdict="Похоже на нужду" /><G.WidgetPreview size="medium" since="2 ч 10" verdict="Похоже на нужду" next="Доза в 19:00" /></div>],
    ["LiveActivity", <G.LiveActivity title="Прогулка" elapsed="12:40" detail="Пописал · 1" />],
    ["OnboardingStep", <G.OnboardingStep step={3} total={3} title="Есть лечение?" body="Включит дозы и окно натощак." primary="Начать" secondary="Пропустить" />],
    ["PermissionCard", <G.PermissionCard title="Уведомления" reason="Чтобы доза не прошла мимо." onLater={n} />],
    ["ReminderSchedule", <G.ReminderSchedule items={[{ icon: "medication", title: "Доза", time: "07:00", repeat: "каждый день", on: true }]} quiet={{ on: true, from: "23:00", to: "07:00" }} critical />],
    ["ExportCard", <G.ExportCard range="23 сен – 2 окт" format="PDF врачу" includes={[{ label: "Дозы и пропуски", on: true }]} />],
    ["InviteCard", <G.InviteCard from="Вика" dog="Стич" />],
    ["Avatar", <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}><G.Avatar name="Вика" ring /><G.Avatar name="Стич" icon="pets" size="xl" /><G.AvatarGroup people={[{ name: "А" }, { name: "Б" }, { name: "В" }, { name: "Г" }]} /></div>],
    ["MediaGrid", <G.MediaGrid items={[{ caption: "09:20" }, { kind: "file", caption: "IDEXX" }]} onAdd={n} />],
    ["ListSkeleton", <G.ListSkeleton rows={2} />],
    ["SyncStatus", <G.SyncStatus state="offline" detail="3 записи" />],
    ["SkillMatrix", <G.SkillMatrix contexts={["Дом", "Двор", "Парк", "Город"]} skills={[{ name: "Место", levels: [3, 2, 1, 0] }, { name: "Ко мне", levels: [3, 3, 2, 1] }]} />],
    ["LabChart", <G.LabChart points={[{ date: "12 мар", value: 14 }, { date: "2 мая", value: 26 }, { date: "15 сен", value: 41 }]} range={{ low: 19, high: 58 }} doses={[{ at: 1, label: "200 мкг" }]} />],
    ["TreatmentPlan", <G.TreatmentPlan drug="Левотироксин" dose="200 мкг" times={["07:00", "19:00"]} since="12 мар" fasting="40 мин без еды" history={[{ date: "9 апр", dose: "200 мкг", reason: "Т4 ниже нормы" }]} onPause={n} />],
    ["DogProfile", <G.DogProfile name="Стич" breed="Шипперке" sex="кобель" age="3 года" weight="7,4 кг" vet={{ name: "Д-р Мартен", clinic: "Клиника Арсон" }} onEdit={n} />],
    ["FamilyList", <G.FamilyList members={[{ name: "Вика", you: true, duty: true, role: "Владелец" }, { name: "Мама", role: "Пишет и видит всё" }]} onHandOff={n} onInvite={n} inviteLocked />],
  ];
  class Boundary extends React.Component { state = { e: null }; static getDerivedStateFromError(e) { return { e }; } render() { return this.state.e ? <div data-err={String(this.state.e.message)} style={{ color: "red" }}>Ошибка: {String(this.state.e.message)}</div> : this.props.children; } }
  function App() {
    return (
      <div style={{ display: "flex", flexWrap: "wrap", gap: 16, padding: 16, alignItems: "flex-start" }}>
        {cases.map(([name, el]) => (
          <div key={name} data-case={name} style={{ width: 320, boxSizing: "border-box", padding: "16px 16px", background: "var(--bg-primary)", borderRadius: 24, position: "relative" }}>
            <div style={{ fontSize: 12, color: "var(--text-secondary)", marginBottom: 8 }}>{name}</div>
            <div data-safe style={{ width: 288, position: "relative" }}><Boundary>{el}</Boundary></div>
          </div>
        ))}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  setTimeout(() => {
    const res = [];
    document.querySelectorAll("[data-case]").forEach((c) => {
      const safe = c.querySelector("[data-safe]"); const R = safe.getBoundingClientRect();
      const err = c.querySelector("[data-err]");
      if (err) { res.push(c.dataset.case + ": ERROR " + err.dataset.err); return; }
      const bad = [];
      safe.querySelectorAll("*").forEach((e) => {
        const r = e.getBoundingClientRect(); if (!r.width) return;
        const cs = getComputedStyle(e); if (cs.position === "fixed") return;
        if (r.right > R.right + 1 || r.left < R.left - 1) bad.push((e.textContent || e.tagName).trim().slice(0, 24) + " [" + Math.round(r.left - R.left) + "…" + Math.round(r.right - R.left) + "]");
        let p = e.parentElement; while (p && p !== safe && getComputedStyle(p).backgroundColor === "rgba(0, 0, 0, 0)") p = p.parentElement;
        if (p && p !== safe && e.textContent.trim() && e.children.length === 0) { const pr = p.getBoundingClientRect(); if (r.bottom > pr.bottom + 1 || r.right > pr.right + 1) bad.push("вылезает: " + e.textContent.trim().slice(0, 24)); }
if (e.dataset && e.dataset.oneLine !== undefined && e.getClientRects && (() => { const rg = document.createRange(); rg.selectNodeContents(e); return new Set([...rg.getClientRects()].map((x) => Math.round(x.top))).size > 1; })()) bad.push("перенос заголовка: " + e.textContent.trim().slice(0, 24));
        if (e.tagName === "BUTTON" && e.scrollHeight > e.clientHeight + 1) bad.push("кнопка мала: " + e.textContent.trim().slice(0, 24));
        else if (e.scrollWidth > e.clientWidth + 1 && !/auto|scroll|hidden/.test(cs.overflowX) && e.children.length === 0 && e.clientWidth) bad.push("clip: " + (e.textContent || "").trim().slice(0, 24));
      });
      if (bad.length) res.push(c.dataset.case + ": " + [...new Set(bad)].slice(0, 4).join(" | "));
    });
    window.__fit = res;
    console.log("FIT " + FS + " " + (Q.get("theme") || "dark") + " → " + (res.length ? res.length + " проблем\n" + res.join("\n") : "всё влезает"));
  }, 2500);
});
</script>
</body></html>
